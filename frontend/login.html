<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
    <!-- Tipografías del caso: Lato para el texto, Pacifico para los títulos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Hojas de estilo propias, externas y separadas por responsabilidad -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">

</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <form class="formulario ">
            <h1 class="formulario__titulo texto-centrado">Pastelería Mil Sabores</h2>
            <span class="formulario__titulo texto-centrado">Inicia Sesión</span>

            <div class="campo">
                <label for="loginInputEmail" class="campo__etiqueta--obligatorio">Ingresa tu correo</label>
                <input type="email" class="campo__control" id="loginInputEmail" aria-describedby="emailHelp">
            </div>

            <div class="campo">
                <label for="loginInputPassword" class="campo__etiqueta--obligatorio">Contraseña</label>
                <input type="password" class="campo__control" id="loginInputPassword">
                <div id="emailHelp" class="form-text"><a href="#">¿Olvidaste tu contraseña?</a></div>
            </div>

            <div class="campo campo--casilla">
                <input type="checkbox" class="campo__control" id="rememberPasswordCheck">
                <label class="campo__etiqueta mb-0" for="rememberPasswordCheck">Recordar Contraseña</label>
            </div>

            <div class="formulario__acciones">
                <button type="submit" class="boton boton--bloque">Iniciar sesión</button>
            </div>

            <div class="formulario__pie">
                <p class="form-text">¿No tienes una cuenta?</p><a href="registro.html">Registrate aquí</a>
            </div>
        </form>
    <div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
